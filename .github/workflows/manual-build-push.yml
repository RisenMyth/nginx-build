name: Manual Docker Build And Push

on:
  workflow_dispatch:
    inputs:
      image_repository:
        description: "镜像仓库名，不包含 registry 也不包含命名空间，例如 nginx-brotli"
        required: true
        default: "nginx-brotli"
      nginx_version:
        description: "NGINX 版本，同时用作镜像标签（如 1.31.10）。留空则取 Dockerfile 中 NGINX_VERSION 的默认值"
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY_INPUT: ${{ vars.REGISTRY || secrets.REGISTRY }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || secrets.REGISTRY_NAMESPACE }}
      REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || vars.REGISTRY_PASSWORD }}
      IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      NGINX_VERSION_INPUT: ${{ inputs.nginx_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize registry reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          raw_registry="${REGISTRY_INPUT%/}"
          registry_namespace="${REGISTRY_NAMESPACE#/}"
          registry_namespace="${registry_namespace%/}"
          image_repository="${IMAGE_REPOSITORY#/}"
          image_repository="${image_repository%/}"

          test -n "${raw_registry}" || { echo "::error::Missing registry. Set workflow input or vars/secrets.REGISTRY."; exit 1; }
          test -n "${REGISTRY_USERNAME}" || { echo "::error::Missing registry username. Set vars/secrets.REGISTRY_USERNAME."; exit 1; }
          test -n "${REGISTRY_PASSWORD}" || { echo "::error::Missing registry password. Set vars/secrets.REGISTRY_PASSWORD."; exit 1; }
          test -n "${image_repository}" || { echo "::error::Missing image repository."; exit 1; }

          if [[ "${raw_registry}" == *"://"* ]]; then
            echo "::error::Registry must not include a protocol. Use registry.example.com or registry.example.com:5000."
            exit 1
          fi

          if [[ "${raw_registry}" == */* ]]; then
            echo "::error::Registry must not include a namespace. Set vars/secrets.REGISTRY_NAMESPACE separately."
            exit 1
          fi

          image_ref="${raw_registry}"
          if [[ -n "${registry_namespace}" ]]; then
            image_ref="${image_ref}/${registry_namespace}"
          fi
          image_ref="${image_ref}/${image_repository}"

          echo "registry_host=${raw_registry}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"

      - name: Resolve nginx version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${NGINX_VERSION_INPUT:-}"
          version="$(printf '%s' "${version}" | tr -d '[:space:]')"
          version="${version#v}"

          if [[ -z "${version}" ]]; then
            version="$(sed -nE 's/^[[:space:]]*(ARG[[:space:]]+)?NGINX_VERSION=([^[:space:]]*).*$/\2/p' Dockerfile | head -n1)"
            echo "nginx_version 输入为空，回退到 Dockerfile 默认值：${version}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid nginx_version '${version}'. Expected a version like 1.27.4 or 1.31.10."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "NGINX_VERSION=${version}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_host }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${{ steps.image.outputs.image_ref }}"
          version="${{ steps.version.outputs.version }}"

          tags="${image_ref}:${version}"$'\n'"${image_ref}:latest"
          {
            echo "primary=${image_ref}:${version}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "将推送以下标签："
          echo "$tags"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NGINX_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          # 阿里云 ACR 不支持 OCI 1.1 attestation（application/vnd.oci.empty.v1+json），
          # 必须关闭 provenance/sbom，否则 push 会报
          # "denied: unknown manifest class for application/vnd.oci.empty.v1+json"
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-build-cache
          cache-to: type=gha,mode=max,scope=docker-build-cache,ignore-error=true

      - name: Verify pushed manifest has no attestations
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ steps.tags.outputs.primary }}"
          echo "Inspecting ${ref}"
          docker buildx imagetools inspect "${ref}"
          if docker buildx imagetools inspect "${ref}" | grep -q "unknown/unknown"; then
            echo "::warning::镜像索引里仍存在 unknown/unknown 平台（attestation）"
          fi
